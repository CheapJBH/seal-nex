name: Build Seal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -alias seal-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore /tmp/seal-release.keystore \
            -storepass sealrelease \
            -keypass sealrelease \
            -dname "CN=Seal, O=Seal, C=US" \
            -noprompt

          cat > keystore.properties <<EOF
          storeFile=/tmp/seal-release.keystore
          storePassword=sealrelease
          keyAlias=seal-release
          keyPassword=sealrelease
          EOF

      - name: Build Release APK with Gradle
        run: ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seal-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

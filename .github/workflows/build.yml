name: Build Seal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clean workspace
        run: rm -rf $GITHUB_WORKSPACE/*

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify commit
        run: git rev-parse HEAD && git log --oneline -3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'


      - name: Build Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
        run: ./gradlew clean assembleGenericRelease --no-build-cache --no-configuration-cache -PABI_FILTERS=arm64-v8a -PnoSplits --no-daemon

      - name: List APK outputs
        run: find app/build/outputs/apk -name '*.apk' -type f -printf '%p %s bytes\n' || true

      - name: Upload APK to artifact
        uses: actions/upload-artifact@v4
        with:
          name: seal-release-apk
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "Seal-Nex v${{ github.run_number }}"
          body: |
            Seal-Nex Android 视频/音频下载器

            ## 新增功能
            - **并发多链接下载**：URL 输入框支持逗号/换行分隔多个链接，最高 3 个任务并发下载
            - **内置 Cookie 浏览器**：设置 → 网络 → Cookie Browser，登录视频平台后导出 Cookies，解锁高清下载
            - 其他：Seal-Nex 品牌、README、图标 + 徽章

            下载 Release 里的 APK 安装即可（arm64-v8a，适配绝大多数手机）。
          artifacts: "app/build/outputs/apk/generic/release/*.apk"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

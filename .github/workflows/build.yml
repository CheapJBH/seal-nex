name: Build Seal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clean workspace
        run: rm -rf $GITHUB_WORKSPACE/*

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify commit
        run: git rev-parse HEAD && git log --oneline -3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -alias seal-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore /tmp/seal-release.keystore \
            -storepass sealrelease \
            -keypass sealrelease \
            -dname "CN=Seal, O=Seal, C=US" \
            -noprompt

          cat > keystore.properties <<EOF
          storeFile=/tmp/seal-release.keystore
          storePassword=sealrelease
          keyAlias=seal-release
          keyPassword=sealrelease
          EOF

      - name: Build Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false"
        run: ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache --refresh-dependencies --no-daemon

      - name: Upload APK to artifact
        uses: actions/upload-artifact@v4
        with:
          name: seal-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "Seal-Nex v${{ github.run_number }}"
          body: |
            Seal-Nex Android 视频/音频下载器

            ## 新增功能
            - **并发多链接下载**：URL 输入框支持逗号/换行分隔多个链接，最高 3 个任务并发下载
            - **内置 Cookie 浏览器**：设置 → 网络 → Cookie Browser，登录视频平台后导出 Cookies，解锁高清下载
            - 其他：Seal-Nex 品牌、README、图标 + 徽章

            下载 `app-release.apk` 安装即可。
          artifacts: "app/build/outputs/apk/release/app-release.apk"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
